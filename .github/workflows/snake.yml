name: Generate Snake and Stats Animations

on:
  # Run automatically every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  
  # Allows to manually run the job at any time
  workflow_dispatch:
  
  # Run on every push on the main/master branch
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Generates a snake game from a github user contributions graph, output a svg animation at <gsv_path>
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # Fetch the latest streak stats SVG and save it to the build dir
      - name: Fetch Streak Stats SVG
        run: |
          mkdir -p dist
          curl -o dist/github-streak.svg "https://streak-stats.demolab.com/?user=${{ github.repository_owner }}&theme=react&border=D97706&ring=D97706&fire=D97706&currStreakLabel=D97706&sideLabels=D97706&background=0D1117&stroke=D97706"
          
      # Push the content of <build_dir> to the output branch
      - name: Push SVGs to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
