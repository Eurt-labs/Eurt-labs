name: Update profile art

# Refreshes the contribution graph SVG daily from real data.
# Runs daily, plus whenever you push to main, plus on-demand.

"on":
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC every day
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install base dependencies
        run: pip install requests==2.32.3 beautifulsoup4==4.12.3 Pillow==12.1.1 numpy==1.26.4 > debug.log 2>&1 || true

      - name: Scrape real contribution data (no auth needed)
        env:
          GH_PROFILE_USER: Eurt-labs
        run: python scripts/fetch_contributions.py >> debug.log 2>&1 || true

      - name: Render animated contribution graph SVG
        run: python scripts/render_heatmap_svg.py >> debug.log 2>&1 || true

      - name: Generate Info Card
        run: python scripts/make_info_card.py >> debug.log 2>&1 || true

      - name: Install photo dependencies
        run: pip install rembg opencv-python-headless >> debug.log 2>&1 || true

      - name: Generate ASCII Portrait
        run: |
          if [ -f "source-photo.jpg" ]; then
            python scripts/prep_photo.py source-photo.jpg source-prepped.png >> debug.log 2>&1 || true
            python scripts/make_ascii_svg.py source-prepped.png dhruv-ascii.svg >> debug.log 2>&1 || true
          fi

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile art [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg info-card.svg source-prepped.png dhruv-ascii.svg debug.log"
