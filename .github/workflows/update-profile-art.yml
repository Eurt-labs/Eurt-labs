name: Update profile art

# Refreshes the contribution graph SVG daily from real data.
# Runs daily, plus whenever you push to main, plus on-demand.

"on":
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC every day
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install base dependencies
        run: pip install requests==2.32.3 beautifulsoup4==4.12.3 Pillow==12.1.1 numpy==1.26.4

      - name: Scrape real contribution data (no auth needed)
        env:
          GH_PROFILE_USER: Eurt-labs
        run: python scripts/fetch_contributions.py

      - name: Render animated contribution graph SVG
        run: python scripts/render_heatmap_svg.py

      - name: Generate Info Card
        run: python scripts/make_info_card.py

      - name: Generate ASCII Portrait
        run: |
          if [ -f "source-photo.jpg" ]; then
            python scripts/prep_photo.py source-photo.jpg source-prepped.png
            python scripts/make_ascii_svg.py source-prepped.png dhruv-ascii.svg
          fi

      - name: Generate Activity Graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: "Eurt-labs"
          output_path: "activity-graph.svg"
          options: "bg_color=0D1117&color=3B82F6&line=3B82F6&point=FFFFFF&area=true&area_color=3B82F6&hide_border=true&custom_title=📈%20Contribution%20Timeline"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile art [skip ci]"
